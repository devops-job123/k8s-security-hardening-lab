apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-root-user
  annotations:
    policies.kyverno.io/title: Disallow Root User
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        object.spec.?securityContext.?runAsUser.orValue(1) > 0
      message: "Running as root is not allowed. spec.securityContext.runAsUser must be unset or > 0."
    - expression: >-
        variables.allContainers.all(container,
          container.?securityContext.?runAsUser.orValue(1) > 0)
      message: "Running as root is not allowed. All containers must have runAsUser unset or > 0."
